name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install frontend deps
        run: npm ci

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'PCFixAI v__VERSION__'
          releaseBody: |
          ## PCFixAI v1.4.0

          ### What's New

          - **Built-in Auto-Updater** — Background update checks, in-app download/install banner, real-time progress, auto-restart
          - **Premium UI Refresh** — Glassmorphism redesign with refined gradients, glow effects, and polished modals
          - **Windows 10 & 11 Compatibility** — Version detection, troubleshooter fallbacks, enhanced WMI queries
          - **Ollama Connection Quality** — Latency monitoring, model verification, auto-recovery detection

          ### Bug Fixes

          - Fixed control flow in fix functions for reliable error recovery
          - Live Metrics panel now uses actual system data
          - Defensive WMI queries for older Windows 10 builds
          - Deep performance escalation with browser cache cleanup

          ### Downloads

          - `PCFixAI-Setup-1.4.0-x64.nsis.exe` — Signed Windows installer

          See the assets to download and install this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
